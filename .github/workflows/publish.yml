name: Publish to Maven Central
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maven-central-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing secrets
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$CENTRAL_USER" || { echo 'Missing MAVEN_CENTRAL_USERNAME'; exit 1; }
          test -n "$CENTRAL_PASSWORD" || { echo 'Missing MAVEN_CENTRAL_PASSWORD'; exit 1; }
          test -n "$SIGNING_KEY" || { echo 'Missing SIGNING_KEY'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shareinbox:jvmTest :shareinbox:testAndroidHostTest :shareinbox:iosSimulatorArm64Test :shareinbox:publishAllPublicationsToLocalBuildRepository
      - run: ./gradlew -p verification/consumer jvmTest compileCommonMainKotlinMetadata compileKotlinIosSimulatorArm64
      - run: swift test
        working-directory: ios-support
      - name: Publish signed artifacts
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :shareinbox:publishAndReleaseToMavenCentral -PreleaseToCentral=true --no-configuration-cache

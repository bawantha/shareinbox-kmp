name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shareinbox:jvmTest :shareinbox:testAndroidHostTest :sample-android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-jvm-test-results
          path: shareinbox/build/reports/tests
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shareinbox:iosSimulatorArm64Test :shareinbox:assembleShareInboxKitDebugXCFramework :shareinbox:publishAllPublicationsToLocalBuildRepository --stacktrace
      - run: ./gradlew -p verification/consumer jvmTest compileCommonMainKotlinMetadata compileKotlinIosSimulatorArm64
      - run: swift test
        working-directory: ios-support
      - run: xcodebuild -project sample-ios/ShareInboxDemo.xcodeproj -scheme ShareInboxDemo -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios-sample CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: shareinbox/build/reports/tests
